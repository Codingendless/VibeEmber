server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wenxinxu.com www.wenxinxu.com;

    root /var/www/zaocitai;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/wenxinxu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wenxinxu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /VibeEmber/api/ {
        proxy_pass http://127.0.0.1:8790/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
        proxy_read_timeout 15s;
    }

    location = /VibeEmber {
        return 301 /VibeEmber/;
    }

    location ^~ /VibeEmber/ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /VibeEmber/index.html;
    }

    include snippets/ai-portfolio.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location ^~ /case-lab/ {
        alias /var/www/case-lab/current/;
        index index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /case-lab/index.html;
    }

    location ^~ /case-lab/assets/ {
        alias /var/www/case-lab/current/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js)$ {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control public;
        try_files $uri =404;
    }
}
